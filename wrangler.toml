name = "ai-audio-tool"
main = "src/index.js"
compatibility_date = "2026-09-27"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"
run_worker_first = ["/*"]

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1009"
simple = { limit = 30, period = 60 }

# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
# ...